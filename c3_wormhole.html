<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C3 Wormhole - EVE Online Asset</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #8888aa;
        }
        h1 {
            color: #cc4444;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #555577;
            margin-bottom: 20px;
            font-size: 12px;
        }
        canvas {
            border: 1px solid #222244;
            background: transparent;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #1a1a2e;
            color: #cc4444;
            border: 1px solid #333355;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: #2a2a4e;
            border-color: #cc4444;
        }
        .info {
            margin-top: 15px;
            font-size: 11px;
            color: #555577;
            text-align: center;
            max-width: 700px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>C3 Wormhole</h1>
    <div class="subtitle">Class 3 • Unknown Space • Teal Aura</div>
    
    <canvas id="wormholeCanvas" width="512" height="512"></canvas>
    
    <div class="controls">
        <button onclick="downloadPNG()">Download PNG</button>
        <button onclick="toggleAnimation()">Toggle Animation</button>
    </div>
    
    <div class="info">
        C3 Wormhole Asset • Based on EVE Online visual identification<br>
        Distinct red and black center with white outer ring, grayish clouds
    </div>

    <script>
        const canvas = document.getElementById('wormholeCanvas');
        const ctx = canvas.getContext('2d');
        
        let animationEnabled = true;
        let time = 0;
        
        function drawC3Wormhole() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Draw C3 wormhole characteristics:
            // - Grayish clouds
            // - Distinct red cloud - easy to identify mark
            // - Red and black center with white outer ring
            // - Teal aura
            
            // Outer teal aura
            const auraGrad = ctx.createRadialGradient(0, 0, 80, 0, 0, 256);
            auraGrad.addColorStop(0, 'rgba(0, 180, 180, 0.3)');
            auraGrad.addColorStop(0.5, 'rgba(0, 150, 160, 0.15)');
            auraGrad.addColorStop(1, 'rgba(0, 120, 140, 0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 256, 0, Math.PI * 2);
            ctx.fill();
            
            // Teal aurora rings
            for (let i = 0; i < 5; i++) {
                const radius = 100 + i * 30;
                const opacity = 0.1 + Math.sin(time * 0.5 + i) * 0.05;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 180, 180, ${opacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // Main wormhole body - grayish clouds
            const cloudGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 120);
            cloudGrad.addColorStop(0, 'rgba(160, 160, 170, 0.8)');
            cloudGrad.addColorStop(0.3, 'rgba(120, 120, 130, 0.6)');
            cloudGrad.addColorStop(0.6, 'rgba(80, 80, 90, 0.4)');
            cloudGrad.addColorStop(1, 'rgba(40, 40, 50, 0.2)');
            ctx.fillStyle = cloudGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 120, 0, Math.PI * 2);
            ctx.fill();
            
            // Distinct red cloud - the key identifier
            const redGrad = ctx.createRadialGradient(-20, -10, 0, -20, -10, 50);
            redGrad.addColorStop(0, 'rgba(200, 40, 40, 0.9)');
            redGrad.addColorStop(0.4, 'rgba(160, 30, 30, 0.7)');
            redGrad.addColorStop(0.7, 'rgba(120, 20, 20, 0.4)');
            redGrad.addColorStop(1, 'rgba(80, 10, 10, 0)');
            ctx.fillStyle = redGrad;
            ctx.beginPath();
            ctx.arc(-20, -10, 50, 0, Math.PI * 2);
            ctx.fill();
            
            // Red cloud details
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + time * 0.2;
                const distance = 15 + Math.sin(time * 0.3 + i) * 10;
                const x = -20 + Math.cos(angle) * distance;
                const y = -10 + Math.sin(angle) * distance;
                const size = 8 + Math.sin(time * 0.5 + i) * 4;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(180, 30, 30, 0.5)';
                ctx.fill();
            }
            
            // Black center
            const blackGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
            blackGrad.addColorStop(0, 'rgba(10, 10, 15, 0.95)');
            blackGrad.addColorStop(0.5, 'rgba(20, 20, 25, 0.8)');
            blackGrad.addColorStop(1, 'rgba(40, 35, 35, 0.4)');
            ctx.fillStyle = blackGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // White outer ring
            ctx.beginPath();
            ctx.arc(0, 0, 65, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(220, 220, 230, 0.6)';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            // White ring glow
            ctx.beginPath();
            ctx.arc(0, 0, 65, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(200, 200, 220, 0.3)';
            ctx.lineWidth = 15;
            ctx.stroke();
            
            // Black spots scattered
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2 + time * 0.1;
                const distance = 45 + Math.sin(time * 0.4 + i) * 20;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                const size = 6 + Math.sin(time * 0.6 + i) * 3;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(20, 20, 25, 0.6)';
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function animate() {
            time += 0.016;
            drawC3Wormhole();
            requestAnimationFrame(animate);
        }
        
        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'c3_wormhole_512x512.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function toggleAnimation() {
            animationEnabled = !animationEnabled;
        }
        
        // Start animation loop
        animate();
    </script>
</body>
</html>
