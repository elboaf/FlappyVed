<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C4 Wormhole - EVE Online Asset</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #8888aa;
        }
        h1 {
            color: #cc4444;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #555577;
            margin-bottom: 20px;
            font-size: 12px;
        }
        canvas {
            border: 1px solid #222244;
            background: transparent;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #1a1a2e;
            color: #cc4444;
            border: 1px solid #333355;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: #2a2a4e;
            border-color: #cc4444;
        }
        .info {
            margin-top: 15px;
            font-size: 11px;
            color: #555577;
            text-align: center;
            max-width: 700px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>C4 Wormhole</h1>
    <div class="subtitle">Class 4 • Dangerous Unknown Space • Gray Aura</div>
    
    <canvas id="wormholeCanvas" width="512" height="512"></canvas>
    
    <div class="controls">
        <button onclick="downloadPNG()">Download PNG</button>
        <button onclick="toggleAnimation()">Toggle Animation</button>
    </div>
    
    <div class="info">
        C4 Wormhole Asset • Based on EVE Online visual identification<br>
        Murky red, purple and blue with a white wedge and black center, distinct black spots
    </div>

    <script>
        const canvas = document.getElementById('wormholeCanvas');
        const ctx = canvas.getContext('2d');
        
        let animationEnabled = true;
        let time = 0;
        
        function drawC4Wormhole() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Draw C4 wormhole characteristics:
            // - Mainly dark red with one bright white cloud
            // - Distinct black spots
            // - Murky red, purple and blue with a white wedge and black center
            // - Gray aura (large mass restriction)
            
            // Outer gray aura
            const auraGrad = ctx.createRadialGradient(0, 0, 80, 0, 0, 256);
            auraGrad.addColorStop(0, 'rgba(150, 150, 160, 0.3)');
            auraGrad.addColorStop(0.5, 'rgba(120, 120, 130, 0.15)');
            auraGrad.addColorStop(1, 'rgba(100, 100, 110, 0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 256, 0, Math.PI * 2);
            ctx.fill();
            
            // Gray aurora rings
            for (let i = 0; i < 5; i++) {
                const radius = 100 + i * 30;
                const opacity = 0.1 + Math.sin(time * 0.5 + i) * 0.05;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(150, 150, 160, ${opacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // Main wormhole body - murky red, purple and blue
            const cloudGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 120);
            cloudGrad.addColorStop(0, 'rgba(120, 40, 40, 0.8)');
            cloudGrad.addColorStop(0.3, 'rgba(100, 50, 60, 0.6)');
            cloudGrad.addColorStop(0.6, 'rgba(80, 40, 70, 0.4)');
            cloudGrad.addColorStop(1, 'rgba(50, 30, 50, 0.2)');
            ctx.fillStyle = cloudGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 120, 0, Math.PI * 2);
            ctx.fill();
            
            // Red cloud base
            const redGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 100);
            redGrad.addColorStop(0, 'rgba(160, 40, 40, 0.7)');
            redGrad.addColorStop(0.5, 'rgba(120, 30, 30, 0.5)');
            redGrad.addColorStop(1, 'rgba(80, 20, 20, 0.2)');
            ctx.fillStyle = redGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 100, 0, Math.PI * 2);
            ctx.fill();
            
            // Purple cloud overlay
            const purpleGrad = ctx.createRadialGradient(30, -20, 0, 30, -20, 80);
            purpleGrad.addColorStop(0, 'rgba(100, 40, 100, 0.6)');
            purpleGrad.addColorStop(0.5, 'rgba(80, 30, 80, 0.4)');
            purpleGrad.addColorStop(1, 'rgba(60, 20, 60, 0.1)');
            ctx.fillStyle = purpleGrad;
            ctx.beginPath();
            ctx.arc(30, -20, 80, 0, Math.PI * 2);
            ctx.fill();
            
            // Blue cloud overlay
            const blueGrad = ctx.createRadialGradient(-30, 20, 0, -30, 20, 70);
            blueGrad.addColorStop(0, 'rgba(40, 60, 120, 0.5)');
            blueGrad.addColorStop(0.5, 'rgba(30, 50, 100, 0.3)');
            blueGrad.addColorStop(1, 'rgba(20, 40, 80, 0.1)');
            ctx.fillStyle = blueGrad;
            ctx.beginPath();
            ctx.arc(-30, 20, 70, 0, Math.PI * 2);
            ctx.fill();
            
            // White wedge
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-80, -100);
            ctx.lineTo(80, -100);
            ctx.closePath();
            const wedgeGrad = ctx.createLinearGradient(0, 0, 0, -100);
            wedgeGrad.addColorStop(0, 'rgba(220, 220, 230, 0.8)');
            wedgeGrad.addColorStop(0.5, 'rgba(200, 200, 210, 0.5)');
            wedgeGrad.addColorStop(1, 'rgba(180, 180, 190, 0.2)');
            ctx.fillStyle = wedgeGrad;
            ctx.fill();
            
            // Bright white cloud
            const whiteCloudGrad = ctx.createRadialGradient(0, -60, 0, 0, -60, 40);
            whiteCloudGrad.addColorStop(0, 'rgba(240, 240, 250, 0.9)');
            whiteCloudGrad.addColorStop(0.5, 'rgba(220, 220, 230, 0.6)');
            whiteCloudGrad.addColorStop(1, 'rgba(200, 200, 210, 0.2)');
            ctx.fillStyle = whiteCloudGrad;
            ctx.beginPath();
            ctx.arc(0, -60, 40, 0, Math.PI * 2);
            ctx.fill();
            
            // Black center
            const blackGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
            blackGrad.addColorStop(0, 'rgba(10, 10, 15, 0.95)');
            blackGrad.addColorStop(0.5, 'rgba(20, 20, 25, 0.8)');
            blackGrad.addColorStop(1, 'rgba(40, 35, 35, 0.4)');
            ctx.fillStyle = blackGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // Distinct black spots
            for (let i = 0; i < 7; i++) {
                const angle = (i / 7) * Math.PI * 2 + time * 0.1;
                const distance = 35 + Math.sin(time * 0.3 + i) * 15;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                const size = 8 + Math.sin(time * 0.5 + i) * 4;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(15, 15, 20, 0.7)';
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function animate() {
            time += 0.016;
            drawC4Wormhole();
            requestAnimationFrame(animate);
        }
        
        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'c4_wormhole_512x512.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function toggleAnimation() {
            animationEnabled = !animationEnabled;
        }
        
        // Start animation loop
        animate();
    </script>
</body>
</html>
