<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C5 Wormhole - EVE Online Asset</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #8888aa;
        }
        h1 {
            color: #cc6633;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #555577;
            margin-bottom: 20px;
            font-size: 12px;
        }
        canvas {
            border: 1px solid #222244;
            background: transparent;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #1a1a2e;
            color: #cc6633;
            border: 1px solid #333355;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: #2a2a4e;
            border-color: #cc6633;
        }
        .info {
            margin-top: 15px;
            font-size: 11px;
            color: #555577;
            text-align: center;
            max-width: 700px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>C5 Wormhole</h1>
    <div class="subtitle">Class 5 • Dangerous Unknown Space • Gray Aura</div>
    
    <canvas id="wormholeCanvas" width="512" height="512"></canvas>
    
    <div class="controls">
        <button onclick="downloadPNG()">Download PNG</button>
        <button onclick="toggleAnimation()">Toggle Animation</button>
    </div>
    
    <div class="info">
        C5 Wormhole Asset • Based on EVE Online visual identification<br>
        Dark red with brown hues, white cloud less bright than C4, orange and white with white wedge
    </div>

    <script>
        const canvas = document.getElementById('wormholeCanvas');
        const ctx = canvas.getContext('2d');
        
        let animationEnabled = true;
        let time = 0;
        
        function drawC5Wormhole() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Draw C5 wormhole characteristics:
            // - Dark red with brown hues mixed in
            // - White cloud not as bright as C4
            // - Orange and white with white wedge through center
            // - Gray aura (large mass restriction)
            
            // Outer gray aura
            const auraGrad = ctx.createRadialGradient(0, 0, 80, 0, 0, 256);
            auraGrad.addColorStop(0, 'rgba(150, 150, 160, 0.3)');
            auraGrad.addColorStop(0.5, 'rgba(120, 120, 130, 0.15)');
            auraGrad.addColorStop(1, 'rgba(100, 100, 110, 0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 256, 0, Math.PI * 2);
            ctx.fill();
            
            // Gray aurora rings
            for (let i = 0; i < 5; i++) {
                const radius = 100 + i * 30;
                const opacity = 0.1 + Math.sin(time * 0.5 + i) * 0.05;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(150, 150, 160, ${opacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // Main wormhole body - dark red with brown hues
            const cloudGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 120);
            cloudGrad.addColorStop(0, 'rgba(100, 40, 30, 0.8)');
            cloudGrad.addColorStop(0.3, 'rgba(90, 50, 35, 0.6)');
            cloudGrad.addColorStop(0.6, 'rgba(70, 40, 30, 0.4)');
            cloudGrad.addColorStop(1, 'rgba(50, 30, 25, 0.2)');
            ctx.fillStyle = cloudGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 120, 0, Math.PI * 2);
            ctx.fill();
            
            // Dark red base
            const redGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 100);
            redGrad.addColorStop(0, 'rgba(140, 45, 30, 0.7)');
            redGrad.addColorStop(0.5, 'rgba(110, 35, 25, 0.5)');
            redGrad.addColorStop(1, 'rgba(80, 25, 15, 0.2)');
            ctx.fillStyle = redGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 100, 0, Math.PI * 2);
            ctx.fill();
            
            // Brown hue overlay
            const brownGrad = ctx.createRadialGradient(20, 10, 0, 20, 10, 90);
            brownGrad.addColorStop(0, 'rgba(120, 70, 40, 0.6)');
            brownGrad.addColorStop(0.5, 'rgba(100, 60, 35, 0.4)');
            brownGrad.addColorStop(1, 'rgba(80, 45, 25, 0.1)');
            ctx.fillStyle = brownGrad;
            ctx.beginPath();
            ctx.arc(20, 10, 90, 0, Math.PI * 2);
            ctx.fill();
            
            // Orange hue overlay
            const orangeGrad = ctx.createRadialGradient(-20, -15, 0, -20, -15, 80);
            orangeGrad.addColorStop(0, 'rgba(180, 90, 30, 0.5)');
            orangeGrad.addColorStop(0.5, 'rgba(150, 75, 25, 0.3)');
            orangeGrad.addColorStop(1, 'rgba(120, 60, 20, 0.1)');
            ctx.fillStyle = orangeGrad;
            ctx.beginPath();
            ctx.arc(-20, -15, 80, 0, Math.PI * 2);
            ctx.fill();
            
            // White wedge (less bright than C4)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-70, -95);
            ctx.lineTo(70, -95);
            ctx.closePath();
            const wedgeGrad = ctx.createLinearGradient(0, 0, 0, -95);
            wedgeGrad.addColorStop(0, 'rgba(200, 190, 180, 0.7)');
            wedgeGrad.addColorStop(0.5, 'rgba(180, 170, 160, 0.4)');
            wedgeGrad.addColorStop(1, 'rgba(160, 150, 140, 0.15)');
            ctx.fillStyle = wedgeGrad;
            ctx.fill();
            
            // White cloud (less bright than C4)
            const whiteCloudGrad = ctx.createRadialGradient(0, -55, 0, 0, -55, 35);
            whiteCloudGrad.addColorStop(0, 'rgba(210, 200, 190, 0.75)');
            whiteCloudGrad.addColorStop(0.5, 'rgba(190, 180, 170, 0.5)');
            whiteCloudGrad.addColorStop(1, 'rgba(170, 160, 150, 0.15)');
            ctx.fillStyle = whiteCloudGrad;
            ctx.beginPath();
            ctx.arc(0, -55, 35, 0, Math.PI * 2);
            ctx.fill();
            
            // Black center
            const blackGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
            blackGrad.addColorStop(0, 'rgba(10, 10, 15, 0.95)');
            blackGrad.addColorStop(0.5, 'rgba(20, 20, 25, 0.8)');
            blackGrad.addColorStop(1, 'rgba(40, 35, 30, 0.4)');
            ctx.fillStyle = blackGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // Black spots
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + time * 0.1;
                const distance = 35 + Math.sin(time * 0.3 + i) * 15;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                const size = 7 + Math.sin(time * 0.5 + i) * 3;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(15, 15, 20, 0.7)';
                ctx.fill();
            }
            
            // Orange glow particles
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2 + time * 0.2;
                const distance = 50 + Math.sin(time * 0.4 + i) * 20;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                const size = 4 + Math.sin(time * 0.6 + i) * 2;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(200, 100, 40, 0.3)';
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function animate() {
            time += 0.016;
            drawC5Wormhole();
            requestAnimationFrame(animate);
        }
        
        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'c5_wormhole_512x512.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function toggleAnimation() {
            animationEnabled = !animationEnabled;
        }
        
        // Start animation loop
        animate();
    </script>
</body>
</html>
