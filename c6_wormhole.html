<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C6 Wormhole - EVE Online Asset</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #8888aa;
        }
        h1 {
            color: #ff4400;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #555577;
            margin-bottom: 20px;
            font-size: 12px;
        }
        canvas {
            border: 1px solid #222244;
            background: transparent;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #1a1a2e;
            color: #ff4400;
            border: 1px solid #333355;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: #2a2a4e;
            border-color: #ff4400;
        }
        .info {
            margin-top: 15px;
            font-size: 11px;
            color: #555577;
            text-align: center;
            max-width: 700px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>C6 Wormhole</h1>
    <div class="subtitle">Class 6 • Deadly Unknown Space • Yellow Aura</div>
    
    <canvas id="wormholeCanvas" width="512" height="512"></canvas>
    
    <div class="controls">
        <button onclick="downloadPNG()">Download PNG</button>
        <button onclick="toggleAnimation()">Toggle Animation</button>
    </div>
    
    <div class="info">
        C6 Wormhole Asset • Based on EVE Online visual identification<br>
        Bright fiery red, very chromatic orange with black details, yellow aura (capital ships)
    </div>

    <script>
        const canvas = document.getElementById('wormholeCanvas');
        const ctx = canvas.getContext('2d');
        
        let animationEnabled = true;
        let time = 0;
        
        function drawC6Wormhole() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Draw C6 wormhole characteristics:
            // - Very chromatic orange with black details
            // - Bright fiery red color
            // - Yellow aura (capital ships can pass through)
            // - Most dangerous class
            
            // Outer yellow aura (capital ship class)
            const auraGrad = ctx.createRadialGradient(0, 0, 80, 0, 0, 256);
            auraGrad.addColorStop(0, 'rgba(255, 200, 50, 0.35)');
            auraGrad.addColorStop(0.5, 'rgba(255, 180, 30, 0.2)');
            auraGrad.addColorStop(1, 'rgba(255, 150, 20, 0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 256, 0, Math.PI * 2);
            ctx.fill();
            
            // Yellow aurora rings (more intense than other classes)
            for (let i = 0; i < 6; i++) {
                const radius = 90 + i * 25;
                const opacity = 0.15 + Math.sin(time * 0.6 + i) * 0.08;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 200, 50, ${opacity})`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            
            // Main wormhole body - fiery red and orange
            const cloudGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 120);
            cloudGrad.addColorStop(0, 'rgba(200, 60, 20, 0.9)');
            cloudGrad.addColorStop(0.3, 'rgba(180, 70, 25, 0.7)');
            cloudGrad.addColorStop(0.6, 'rgba(150, 50, 20, 0.5)');
            cloudGrad.addColorStop(1, 'rgba(100, 30, 10, 0.3)');
            ctx.fillStyle = cloudGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 120, 0, Math.PI * 2);
            ctx.fill();
            
            // Fiery red base
            const redGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 110);
            redGrad.addColorStop(0, 'rgba(220, 50, 10, 0.8)');
            redGrad.addColorStop(0.4, 'rgba(200, 40, 15, 0.6)');
            redGrad.addColorStop(0.7, 'rgba(170, 30, 10, 0.4)');
            redGrad.addColorStop(1, 'rgba(130, 20, 5, 0.2)');
            ctx.fillStyle = redGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 110, 0, Math.PI * 2);
            ctx.fill();
            
            // Bright orange overlay
            const orangeGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 90);
            orangeGrad.addColorStop(0, 'rgba(255, 120, 20, 0.7)');
            orangeGrad.addColorStop(0.5, 'rgba(240, 100, 15, 0.5)');
            orangeGrad.addColorStop(1, 'rgba(200, 80, 10, 0.2)');
            ctx.fillStyle = orangeGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 90, 0, Math.PI * 2);
            ctx.fill();
            
            // Fiery tendrils (animated)
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2 + time * 0.3;
                const length = 60 + Math.sin(time * 0.5 + i) * 20;
                const x = Math.cos(angle) * length * 0.5;
                const y = Math.sin(angle) * length * 0.5;
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(
                    Math.cos(angle + 0.2) * length * 0.7,
                    Math.sin(angle + 0.2) * length * 0.7,
                    Math.cos(angle) * length,
                    Math.sin(angle) * length
                );
                ctx.strokeStyle = `rgba(255, ${100 + i * 10}, 20, ${0.3 + Math.sin(time * 0.4 + i) * 0.15})`;
                ctx.lineWidth = 8 - i * 0.5;
                ctx.stroke();
            }
            
            // Black details scattered
            for (let i = 0; i < 10; i++) {
                const angle = (i / 10) * Math.PI * 2 + time * 0.15;
                const distance = 25 + Math.sin(time * 0.4 + i * 0.7) * 25;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                const size = 6 + Math.sin(time * 0.6 + i) * 4;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(10, 10, 15, 0.8)';
                ctx.fill();
            }
            
            // Intense central glow
            const centerGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
            centerGlow.addColorStop(0, 'rgba(255, 180, 50, 0.9)');
            centerGlow.addColorStop(0.3, 'rgba(255, 120, 30, 0.6)');
            centerGlow.addColorStop(0.6, 'rgba(220, 80, 20, 0.3)');
            centerGlow.addColorStop(1, 'rgba(180, 50, 10, 0)');
            ctx.fillStyle = centerGlow;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();
            
            // Black center
            const blackGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
            blackGrad.addColorStop(0, 'rgba(10, 10, 15, 0.95)');
            blackGrad.addColorStop(0.5, 'rgba(20, 15, 15, 0.8)');
            blackGrad.addColorStop(1, 'rgba(40, 25, 20, 0.4)');
            ctx.fillStyle = blackGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Fiery particles
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2 + time * 0.4;
                const distance = 40 + Math.sin(time * 0.6 + i * 0.5) * 30;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                const size = 2 + Math.sin(time * 0.8 + i) * 1.5;
                const alpha = 0.4 + Math.sin(time * 0.7 + i) * 0.2;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, ${120 + i * 8}, 20, ${alpha})`;
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function animate() {
            time += 0.016;
            drawC6Wormhole();
            requestAnimationFrame(animate);
        }
        
        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'c6_wormhole_512x512.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function toggleAnimation() {
            animationEnabled = !animationEnabled;
        }
        
        // Start animation loop
        animate();
    </script>
</body>
</html>
